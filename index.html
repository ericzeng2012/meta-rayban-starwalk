<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meta Ray-Ban Starmap</title>
    <link rel="stylesheet" href="style.css">
    <!-- Local Offline SunCalc Library -->
    <script src="suncalc.min.js"></script>
</head>
<body>
    <div id="hud-container">
        <header>
            <h1>STARWALK HUD</h1>
            <div id="status">Initializing Astronomy Engine...</div>
            <div id="location-row">Location: <span id="location">--</span></div>
        </header>
        
        <main>
            <div id="orientation-data">
                <p>Head Heading (Alpha): <span id="alpha">--</span>&deg;</p>
                <p>Head Pitch (Beta): <span id="beta">--</span>&deg;</p>
                <p>Head Roll (Gamma): <span id="gamma">--</span>&deg;</p>
            </div>
            
            <!-- Celestial Target Box (Tracking the Moon) -->
            <div id="celestial-target" style="margin-top: 15px; background: rgba(0, 255, 204, 0.05); padding: 15px; border-radius: 5px;">
                <p id="target-label"><strong>Target: Moon</strong></p>
                <p>Azimuth: <span id="target-az">--</span>&deg;</p>
                <p>Altitude: <span id="target-alt">--</span>&deg;</p>
            </div>

            <div id="moon-offset" style="margin-top: 15px; padding: 15px;">
                <p><strong>Target vs. Your View</strong></p>
                <p>Turn (Az): <span id="offset-az">--</span>&deg;</p>
                <p>Tilt (Alt): <span id="offset-alt">--</span>&deg;</p>
                <p id="guide">--</p>
                <svg id="radar" viewBox="-70 -70 140 140" aria-label="Direction to target">
                    <circle class="ring" r="60"></circle>
                    <circle class="ring" r="30"></circle>
                    <line class="axis" x1="-60" y1="0" x2="60" y2="0"></line>
                    <line class="axis" x1="0" y1="-60" x2="0" y2="60"></line>
                    <polygon id="radar-arrow" points="0,-50 8,-32 -8,-32" visibility="hidden"></polygon>
                    <circle id="radar-dot" r="5" cx="0" cy="0"></circle>
                </svg>
            </div>

            <div id="target-reticle">
                <p class="blink">● TRACKING CELESTIAL GRID</p>
            </div>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
