<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meta Ray-Ban Starmap</title>
    <!-- Load the HUD's colors, layout, and animation rules. -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Main HUD panel: status at the top, sensor readings and reticle below. -->
    <div id="hud-container">
        <header>
            <h1>STARWALK HUD</h1>
            <!-- app.js changes this message as sensor support or permission changes. -->
            <div id="status">Initializing Sensors...</div>
        </header>
        
        <main>
            <!-- These IDs let app.js put live orientation readings into the page. -->
            <div id="orientation-data">
                <p>Alpha (Heading): <span id="alpha">--</span>&deg;</p>
                <p>Beta (Pitch): <span id="beta">--</span>&deg;</p>
                <p>Gamma (Roll): <span id="gamma">--</span>&deg;</p>
            </div>
            <!-- Placeholder indicator; it does not identify stars yet. -->
            <div id="target-reticle">
                <p class="blink">● SCANNING SKY</p>
            </div>
        </main>
    </div>

    <!-- Load the sensor code after the HUD elements so it can find them. -->
    <script src="app.js"></script>
</body>
</html>
